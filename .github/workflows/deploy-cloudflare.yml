name: Deploy Cloudflare Stack

on:
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  CF_ACCOUNT_ID: "ce41117b4a8a18c65878b64c70fe2bdc"
  CF_PAGES_PROJECT_PUBLIC: "g7petsgrooming-public"
  CF_PAGES_PROJECT_ADMIN: "g7petsgrooming-admin"
  VITE_API_BASE: "https://g7petsgrooming-api.godkin.workers.dev"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all
        run: npm run build

  deploy-worker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: apps/worker-api
          command: deploy

  deploy-public-ui:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Public UI
        working-directory: apps/public-ui
        env:
          VITE_API_BASE: ${{ env.VITE_API_BASE }}
          ENV: prod
        run: npm run build

      - name: Deploy Public UI to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: >-
            pages deploy apps/public-ui/dist
            --project-name ${{ env.CF_PAGES_PROJECT_PUBLIC }}
            --branch main

  deploy-admin-ui:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Admin UI
        working-directory: apps/admin-ui
        env:
          VITE_API_BASE: ${{ env.VITE_API_BASE }}
          ENV: prod
        run: npm run build

      - name: Deploy Admin UI to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: >-
            pages deploy apps/admin-ui/dist
            --project-name ${{ env.CF_PAGES_PROJECT_ADMIN }}
            --branch main
